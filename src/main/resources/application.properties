# ==============================================================================
# OmegaMart Application Configuration Properties
# ==============================================================================

# Database Connection (H2 Embedded Persistent File Database)
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/omegamartdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.user=sa
db.password=

# HikariCP Connection Pool Configuration
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000

# Application Session Settings
session.timeoutMinutes=30
cookie.secure=false

# AI Chatbot Configuration
chatbot.provider=MOCK
chatbot.rateLimitPerMinute=10
chatbot.maxMessageLength=300
gemini.apiKey=
gemini.model=gemini-1.5-flash
